name: Daily Trade Digest v3

on:
  schedule:
    - cron: '30 11 * * *'  # 6:30 AM ET (11:30 UTC)
  workflow_dispatch:         # Manual trigger

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python pipeline.py

      - name: Commit and push
        run: |
          git config user.name "Trade Digest Bot"
          git config user.email "bot@trade-digest.local"
          git add -A
          git diff --staged --quiet || git commit -m "Digest $(date -u +%Y-%m-%d)"
          git push
